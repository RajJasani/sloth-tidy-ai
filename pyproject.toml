[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sloth-tidy-ai"
version = "1.0.0"
authors = [
  { name="Raj Jasani", email="raj.jasani2008@gmail.com" },
]
description = "Local-First Open-Source Ambient Workspace Organizer & Overnight Digest Engine"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
sloth = "sloth_ai.cli:main"
